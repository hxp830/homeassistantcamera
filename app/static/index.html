<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YOLO 多路手势识别管理</title>
  <!-- Served locally so the console keeps working on an isolated LAN. -->
  <script src="/static/vendor/tailwind.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    input, select {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      transition: all 0.3s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(71, 85, 105, 0.5);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s ease;
    }
    .btn-secondary:hover { background: rgba(71, 85, 105, 0.8); }
    .btn-icon {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      transition: all 0.2s ease;
    }
    .btn-icon:hover {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }
    .canvas-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.05);
      aspect-ratio: 16 / 9;
    }
    .canvas-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
      transition: opacity 0.3s;
    }
    .canvas-container:hover img { opacity: 0.9; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .modal-overlay { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e2e8f0;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 420px;
    }
    .toast.show { transform: translateX(0); }
    .dot-online { background: #34d399; }
    .dot-offline { background: #f87171; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <div id="toast-container"></div>

  <!-- Token gate, only shown when the server requires API_TOKEN -->
  <div id="authModal" class="fixed inset-0 modal-overlay z-[100] hidden items-center justify-center p-4">
    <div class="glass-card p-6 w-full max-w-sm space-y-4">
      <h2 class="text-lg font-semibold text-white" data-i18n="auth_title">需要访问令牌</h2>
      <p class="text-sm text-slate-400" data-i18n="auth_hint">该实例启用了 API_TOKEN，请输入令牌以继续。</p>
      <input id="authToken" type="password" class="w-full px-4 py-2.5 rounded-lg text-sm" data-i18n-placeholder="auth_placeholder" placeholder="API Token" />
      <button onclick="submitToken()" class="btn-primary w-full px-4 py-2.5 rounded-lg text-sm font-medium" data-i18n="auth_submit">登录</button>
    </div>
  </div>

  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </div>
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400" data-i18n="header_title">YOLO 智能手势识别中心</h1>
      </div>
      <div class="flex items-center gap-3">
        <select id="langSwitch" onchange="setLanguage(this.value)" class="px-2.5 py-1.5 rounded-lg text-xs bg-slate-800/70 border border-slate-700 text-slate-200">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
        <div id="status" class="status-badge" data-i18n="status_loading">加载中...</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-6">

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="glass-card p-6">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          <h2 class="text-lg font-semibold text-white" data-i18n="section_add_source">新增视频源</h2>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input id="newName" class="w-full px-4 py-2.5 rounded-lg text-sm" data-i18n-placeholder="placeholder_camera_name" placeholder="摄像头名称（如：客厅）" />
            <input id="newSource" class="w-full px-4 py-2.5 rounded-lg text-sm" data-i18n-placeholder="placeholder_stream" placeholder="流地址 (rtsp://... 或 /dev/video0)" />
          </div>
          <div class="flex flex-col sm:flex-row gap-4">
            <input id="newLabels" class="flex-1 px-4 py-2.5 rounded-lg text-sm" data-i18n-placeholder="placeholder_labels_optional" placeholder="推送标签，逗号分隔（选填）" />
            <button onclick="addSource()" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              <span data-i18n="btn_add">添加</span>
            </button>
          </div>
        </div>
      </div>

      <div class="glass-card p-6">
        <div class="flex items-center gap-2 mb-4">
          <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          <h2 class="text-lg font-semibold text-white" data-i18n="section_model_mgmt">模型管理</h2>
        </div>
        <div class="space-y-4">
          <div class="flex items-center gap-4">
            <input type="file" id="modelFile" accept=".pt" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-slate-700 file:text-sky-400 hover:file:bg-slate-600 transition-all cursor-pointer bg-slate-800/50 rounded-lg border border-slate-700" />
            <button onclick="uploadModel()" class="btn-secondary px-6 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-i18n="btn_upload">上传</button>
          </div>
          <div class="flex items-center gap-4">
            <select id="modelSelect" onchange="onGlobalModelChange(this.value)" class="flex-1 px-4 py-2.5 rounded-lg text-sm"></select>
            <button onclick="activateModel()" class="btn-primary px-6 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap" data-i18n="btn_apply_global_model">应用全局模型</button>
          </div>
        </div>
      </div>
    </div>

    <details class="glass-card group" open>
      <summary class="p-6 cursor-pointer flex items-center justify-between list-none">
        <div class="flex items-center gap-2">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
          <h2 class="text-lg font-semibold text-white" data-i18n="section_mqtt">MQTT 桥接设置</h2>
          <span id="mqttState" class="ml-2 text-xs px-2 py-0.5 rounded-full border border-slate-600 text-slate-400"></span>
        </div>
        <svg class="w-5 h-5 text-slate-400 group-open:-rotate-180 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </summary>
      <div class="px-6 pb-6 pt-2 border-t border-slate-700/50 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_host">主机地址</label>
            <input id="mqttHost" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="192.168.1.x" />
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_port">端口</label>
            <input id="mqttPort" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="1883" />
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_user">用户名</label>
            <input id="mqttUser" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="User" />
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_password">密码</label>
            <input id="mqttPassword" class="w-full px-4 py-2 rounded-lg text-sm" type="password" placeholder="Password" />
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_client_id">客户端 ID</label>
            <input id="mqttClientId" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="gesture_yolo_client" />
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_discovery">Discovery 前缀 (HA)</label>
            <input id="mqttDiscovery" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="homeassistant" />
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400 font-medium ml-1" data-i18n="label_mqtt_state_topic">基础 State Topic</label>
            <input id="mqttStateTopic" class="w-full px-4 py-2 rounded-lg text-sm" placeholder="gesture_yolo_ha/state" />
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button onclick="testMqtt()" class="btn-secondary px-6 py-2 rounded-lg text-sm font-medium" data-i18n="btn_test_connection">测试连接</button>
          <button onclick="saveMqtt()" class="btn-primary px-6 py-2 rounded-lg text-sm font-medium" data-i18n="btn_save_apply">保存并应用</button>
        </div>
      </div>
    </details>

    <div>
      <div class="flex items-center gap-2 mb-6 ml-2">
        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        <h2 class="text-xl font-bold text-white tracking-wide" data-i18n="section_live_matrix">实时监控矩阵</h2>
      </div>
      <div id="sourceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

  </main>

  <div id="zoomModal" class="fixed inset-0 modal-overlay z-50 hidden items-center justify-center p-4 transition-opacity" onclick="closeZoom()">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-6xl overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/80">
        <h3 id="zoomTitle" class="text-lg font-semibold text-white" data-i18n="zoom_title">视频放大</h3>
        <button class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-slate-800" onclick="closeZoom()">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="p-4 bg-black">
        <!-- The zoom view uses the MJPEG stream: one connection, full frame rate. -->
        <img id="zoomImage" class="w-full h-auto rounded-lg" alt="" />
      </div>
    </div>
  </div>

    const STATUS_POLL_MS = 2500;

    const visibleTiles = new Set();
    let availableModels = [];

    const pendingSourceModels = new Map();

    const latestSourceStatus = new Map();
    let zoomSourceId = '';
    let statusTimer = null;

    const modelNameMap = { mediapipe_hands: () => t('model_mediapipe') };

    function t(key, vars) {
      const langPack = I18N[currentLang] || I18N.zh;
      let text = langPack[key] || I18N.zh[key] || key;
      if (vars && typeof vars === 'object') {
        Object.keys(vars).forEach(k => { text = text.replaceAll(`{${k}}`, String(vars[k])); });
      }
      return text;
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
      ));
    }

    function applyLanguage() {
      document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : currentLang;
      document.title = t('page_title');
      const langEl = document.getElementById('langSwitch');
      if (langEl) langEl.value = currentLang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      document.querySelectorAll('[id^="name-"]').forEach(el => { el.placeholder = t('placeholder_custom_name'); });
      document.querySelectorAll('[id^="labels-"]').forEach(el => { el.placeholder = t('placeholder_push_labels'); });
      document.querySelectorAll('button[data-role="save-source"]').forEach(el => { el.textContent = t('btn_save'); });
      document.querySelectorAll('button[data-role="clone-source"]').forEach(el => { el.title = t('title_clone_card'); });
      document.querySelectorAll('button[data-role="delete-source"]').forEach(el => { el.title = t('title_delete'); });
      document.querySelectorAll('button[data-role="copy-topic"]').forEach(el => { el.title = t('title_copy_mqtt'); });

    function setLanguage(lang) {
      const next = (lang || '').toLowerCase();
      if (!SUPPORTED_LANGS.includes(next)) return;
      currentLang = next;
      localStorage.setItem(LANG_KEY, currentLang);
      applyLanguage();
      refreshModels().catch(() => {});
      refreshStatus().catch(() => {});
    }

    function getModelDisplayName(name) {
      const handler = modelNameMap[name];
      return typeof handler === 'function' ? handler() : (handler || name);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      const color = type === 'success' ? 'text-emerald-400' : 'text-red-400';
      const path = type === 'success'
        ? 'M5 13l4 4L19 7'
        : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
      toast.innerHTML = `<svg class="w-5 h-5 ${color}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${path}"></path></svg><span class="text-sm font-medium"></span>`;
      toast.querySelector('span').textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(t('toast_copy_ok'));
      } catch (err) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast(t('toast_copy_ok'));
        } catch (e) {
          showToast(t('toast_copy_fail'), 'error');
        }
        document.body.removeChild(textArea);
      }
    }

    function parseErrorText(text) {
      try {
        const obj = JSON.parse(text);
        if (obj.detail) return typeof obj.detail === 'string' ? obj.detail : JSON.stringify(obj.detail);
      } catch (_) {}
      return text || 'Unknown error';
    }

    class AuthError extends Error {}

    async function fetchJson(url, opt, timeoutMs = 10000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const r = await fetch(url, { ...(opt || {}), signal: controller.signal });
        const text = await r.text();
        if (r.status === 401) {
          openAuthGate();
          throw new AuthError('unauthorized');
        }
        if (!r.ok) throw new Error(parseErrorText(text));
        return text ? JSON.parse(text) : {};
      } catch (e) {
        if (e.name === 'AbortError') throw new Error(t('err_timeout'));
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    function openAuthGate() {
      const modal = document.getElementById('authModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('authToken').focus();
    }

    async function submitToken() {
      const token = document.getElementById('authToken').value;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (!r.ok) return showToast(t('auth_failed'), 'error');
        const modal = document.getElementById('authModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('authToken').value = '';
        await init();
      } catch (e) {
        showToast(t('auth_failed'), 'error');
      }
    }

    async function refreshModels() {
      const data = await fetchJson('/api/models');
      availableModels = Array.isArray(data.models) ? data.models : [];
      const sel = document.getElementById('modelSelect');
      const oldGlobal = pendingGlobalModel || sel.value || '';
      sel.innerHTML = '';
      availableModels.forEach(m => {
        const o = document.createElement('option');
        o.value = m;
        o.textContent = getModelDisplayName(m);
        sel.appendChild(o);
      });
      if (oldGlobal && availableModels.includes(oldGlobal)) sel.value = oldGlobal;
      document.querySelectorAll('[id^="model-"]').forEach(el => {
        const sourceId = el.id.replace('model-', '');
        renderSourceModelOptions(sourceId, pendingSourceModels.get(sourceId) || el.value);
      });
    }

    function renderSourceModelOptions(sourceId, selectedModel) {
      const sel = document.getElementById(`model-${sourceId}`);
      if (!sel) return;
      const isFocused = document.activeElement === sel;
      const current = sel.value || '';
      const next = selectedModel || current || '';
      const oldValues = Array.from(sel.options).map(o => o.value);
      const listChanged = oldValues.length !== availableModels.length || oldValues.some((v, i) => v !== availableModels[i]);
      if (listChanged) {
        sel.innerHTML = '';
        availableModels.forEach(m => {
          const o = document.createElement('option');
          o.value = m;
          o.textContent = getModelDisplayName(m);
          sel.appendChild(o);
        });
      }
      const finalValue = isFocused ? current : next;
      if (finalValue && availableModels.includes(finalValue)) sel.value = finalValue;
    }

    function onSourceModelChange(sourceId, value) { pendingSourceModels.set(sourceId, value); }
    function onSourceNameInput(sourceId, value) { pendingSourceNames.set(sourceId, value); }
    function onSourceLabelsInput(sourceId, value) { pendingSourceLabels.set(sourceId, value); }
    function onGlobalModelChange(value) { pendingGlobalModel = value || ''; }

      document.getElementById('mqttHost').value = m.host || '';
      document.getElementById('mqttPort').value = m.port || 1883;
      document.getElementById('mqttUser').value = m.user || '';
      // The server never returns the real password, only a mask that means "unchanged".
      document.getElementById('mqttPassword').value = m.password || '';
      document.getElementById('mqttClientId').value = m.client_id || '';
      document.getElementById('mqttDiscovery').value = m.discovery_prefix || '';
      document.getElementById('mqttStateTopic').value = m.state_topic || '';

    function mqttPayload() {
      return {
        host: document.getElementById('mqttHost').value.trim(),
        port: Number(document.getElementById('mqttPort').value || 1883),
        user: document.getElementById('mqttUser').value,
        password: document.getElementById('mqttPassword').value,
        client_id: document.getElementById('mqttClientId').value.trim(),
        discovery_prefix: document.getElementById('mqttDiscovery').value.trim(),
        state_topic: document.getElementById('mqttStateTopic').value.trim()
      };

        }, 12000);
        showToast(t('toast_mqtt_saved'));
        await refreshMqtt();

        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');

        if (!sourceId) return;

    /* Grid tiles poll snapshots instead of holding an MJPEG connection each: browsers
       cap concurrent connections per host at ~6, which multi-camera grids would exhaust. */
    function startTilePoller(sourceId) {
      if (tilePollers.has(sourceId)) return;
      let running = true;
      tilePollers.set(sourceId, () => { running = false; });
      const img = document.getElementById(`cam-${sourceId}`);

      async function tick() {
        if (!running) return;
        if (document.hidden || !visibleTiles.has(sourceId)) {
          setTimeout(tick, 500);
          return;
        }
        try {
          const r = await fetch(`/snapshot/${encodeURIComponent(sourceId)}.jpg?t=${Date.now()}`, { cache: 'no-store' });
          if (r.ok) {
            const blob = await r.blob();
            const url = URL.createObjectURL(blob);
            const previous = img.dataset.objectUrl;
            img.src = url;
            if (previous) URL.revokeObjectURL(previous);
            img.dataset.objectUrl = url;
          }
        } catch (_) {}
        setTimeout(tick, GRID_POLL_MS);
      }
      tick();
    }

    function stopTilePoller(sourceId) {
      const stop = tilePollers.get(sourceId);
      if (stop) stop();
      tilePollers.delete(sourceId);
      const img = document.getElementById(`cam-${sourceId}`);
      if (img && img.dataset.objectUrl) URL.revokeObjectURL(img.dataset.objectUrl);
    }

    function openZoom(sourceId) {

      const titleEl = document.getElementById(`title-${sourceId}`);
      document.getElementById('zoomTitle').textContent =
        t('zoom_preview', { name: titleEl ? titleEl.textContent : sourceId });
      document.getElementById('zoomImage').src = `/stream/${encodeURIComponent(sourceId)}.mjpg?t=${Date.now()}`;
    }

    function closeZoom() {
      const modal = document.getElementById('zoomModal');
      zoomSourceId = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      // Clearing src is what actually terminates the MJPEG connection.
      document.getElementById('zoomImage').removeAttribute('src');
    }

    async function refreshStatus() {
      const s = await fetchJson('/api/status');
      const statusEl = document.getElementById('status');
      statusEl.innerHTML = '';
      const dot = document.createElement('span');
      dot.className = 'w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse';
      statusEl.appendChild(dot);
      statusEl.appendChild(document.createTextNode(
        `${t('status_current_model')}: ${getModelDisplayName(s.model)} · ${t('status_devices_online')}: ${s.sources.length}`
      ));

      const mqttState = document.getElementById('mqttState');
      mqttState.textContent = s.mqtt_connected ? t('mqtt_online') : t('mqtt_offline');
      mqttState.className = s.mqtt_connected
        ? 'ml-2 text-xs px-2 py-0.5 rounded-full border border-emerald-500/40 text-emerald-400'
        : 'ml-2 text-xs px-2 py-0.5 rounded-full border border-red-500/40 text-red-400';

      const globalSel = document.getElementById('modelSelect');
      const globalTarget = pendingGlobalModel || s.model;
      if (document.activeElement !== globalSel && globalTarget && availableModels.includes(globalTarget)) {
        globalSel.value = globalTarget;
      }

      const alive = new Set();
      s.sources.forEach(src => {
        latestSourceStatus.set(src.source_id, src);
        alive.add(src.source_id);
        ensureTile(src);

        document.getElementById(`title-${src.source_id}`).textContent = src.name || src.source_id;
        document.getElementById(`dot-${src.source_id}`).className =
          `w-2 h-2 rounded-full flex-shrink-0 ${src.connected ? 'dot-online' : 'dot-offline'}`;
        document.getElementById(`fps-${src.source_id}`).textContent =
          src.connected ? `${src.fps ?? 0} fps` : t('cam_offline');

        const pendingName = pendingSourceNames.get(src.source_id);
        const pendingLabels = pendingSourceLabels.get(src.source_id);
        document.getElementById(`name-${src.source_id}`).value =
          pendingName !== undefined ? pendingName : (src.name || src.source_id);
        document.getElementById(`labels-${src.source_id}`).value =
          pendingLabels !== undefined ? pendingLabels : (src.labels_text || '');
        renderSourceModelOptions(src.source_id, pendingSourceModels.get(src.source_id) || src.model || s.model || '');

        const base = (document.getElementById('mqttStateTopic').value || 'gesture_yolo_ha/state').trim();
        document.getElementById(`topic-${src.source_id}`).textContent = `${base}/${src.source_id}`;

        const detectEl = document.getElementById(`detect-${src.source_id}`);
        if (src.latest && src.latest.gesture && src.latest.gesture !== 'none') {
          detectEl.textContent = `${src.latest.gesture} ${(src.latest.confidence * 100).toFixed(0)}%`;
          detectEl.style.display = 'block';
        } else {
          detectEl.style.display = 'none';
        }
      });

      [...tilePollers.keys()].forEach(id => {
        if (!alive.has(id)) {
          stopTilePoller(id);
          pendingSourceModels.delete(id);
          pendingSourceNames.delete(id);
          pendingSourceLabels.delete(id);
          latestSourceStatus.delete(id);
          visibleTiles.delete(id);
          const tile = document.getElementById(`tile-${id}`);
          if (tile) { tileObserver.unobserve(tile); tile.remove(); }
          if (zoomSourceId === id) closeZoom();
        }
      });
    }

    async function addSource() {
      const source = document.getElementById('newSource').value.trim();
      const name = document.getElementById('newName').value.trim();
      const labels = document.getElementById('newLabels').value.trim();
      if (!source) return showToast(t('err_need_source'), 'error');
      try {
        await fetchJson('/api/sources', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source, name, labels })
        }, 30000);
        document.getElementById('newSource').value = '';
        document.getElementById('newName').value = '';
        document.getElementById('newLabels').value = '';
        await refreshStatus();
        showToast(t('toast_source_added'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');
      }
    }

    async function saveSourceConfig(sourceId) {
      try {
        await fetchJson(`/api/sources/${encodeURIComponent(sourceId)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById(`name-${sourceId}`).value.trim(),
            labels: document.getElementById(`labels-${sourceId}`).value.trim(),
            model: document.getElementById(`model-${sourceId}`).value
          })
        }, 30000);
        pendingSourceModels.delete(sourceId);
        pendingSourceNames.delete(sourceId);
        pendingSourceLabels.delete(sourceId);
        await refreshStatus();
        showToast(t('toast_source_saved'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');
      }
    }

    async function cloneSource(sourceId) {
      const src = latestSourceStatus.get(sourceId);
      if (!src) return showToast(t('err_source_read_failed'), 'error');
      const model = pendingSourceModels.get(sourceId) || src.model || document.getElementById('modelSelect').value;
      try {
        await fetchJson('/api/sources', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: src.source,
            name: `${src.name || sourceId}_copy`,
            labels: src.labels_text || '',
            model
          })
        }, 30000);
        await refreshStatus();
        showToast(t('toast_source_cloned'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_clone_failed', { msg: e.message }), 'error');
      }
    }

    async function removeSource(sourceId) {
      if (!confirm(t('confirm_delete_source'))) return;
      try {
        await fetchJson(`/api/sources/${encodeURIComponent(sourceId)}`, { method: 'DELETE' });
        await refreshStatus();
        showToast(t('toast_source_deleted'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');
      }
    }

    async function uploadModel() {
      const f = document.getElementById('modelFile').files[0];
      if (!f) return showToast(t('err_choose_pt'), 'error');
      const fd = new FormData();
      fd.append('file', f);
      try {
        await fetchJson('/api/models/upload', { method: 'POST', body: fd }, 600000);
        await refreshModels();
        showToast(t('toast_upload_done'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');
      }
    }

    async function activateModel() {
      const name = document.getElementById('modelSelect').value;
      if (!name) return showToast(t('err_no_model'), 'error');
      try {
        await fetchJson('/api/models/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        }, 60000);
        pendingGlobalModel = '';
        await refreshStatus();
        showToast(t('toast_model_switched'));
      } catch (e) {
        if (!(e instanceof AuthError)) showToast(t('toast_save_failed', { msg: e.message }), 'error');
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom(); });
    document.getElementById('authToken').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitToken();
    });

    async function init() {
      applyLanguage();
      await refreshModels();
      await refreshMqtt();
      await refreshStatus();
      if (statusTimer) clearInterval(statusTimer);
      statusTimer = setInterval(() => refreshStatus().catch(() => {}), STATUS_POLL_MS);
    }

    init().catch(e => {
      if (e instanceof AuthError) return;
      document.getElementById('status').textContent = t('status_init_failed', { msg: e.message });
    });
  </script>
</body>
</html>
