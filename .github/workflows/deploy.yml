name: Deploy To Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || '22' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx python-dotenv paho-mqtt fastapi
          # Only the dependency-light suites; the server runs the full set.
          python -m pytest tests/test_config.py tests/test_store.py tests/test_mqtt_bridge.py -q

      - name: Copy Project Files To Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          source: |
            app
            tools
            tests
            requirements.txt
            requirements-dev.txt
            pyproject.toml
            .env.example
            README.md
            README.zh-CN.md
            README.en.md
            README.ru.md
            run.ps1

      - name: Install Dependencies And Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ ! -x .venv/bin/python3 ]; then
              python3 -m venv .venv
            fi
            .venv/bin/python3 -m pip install -r requirements.txt --progress-bar off
            echo "${{ secrets.DEPLOY_PASSWORD }}" | sudo -S systemctl restart "${{ secrets.DEPLOY_SERVICE }}"
            systemctl is-active "${{ secrets.DEPLOY_SERVICE }}"

      - name: Verify Service Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ env.DEPLOY_PORT }}
          script: |
            set -e
            PORT="${{ secrets.DEPLOY_HEALTH_PORT }}"
            PORT="${PORT:-8000}"
            for attempt in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:${PORT}/healthz" > /tmp/gesture_health.json; then
                cat /tmp/gesture_health.json
                exit 0
              fi
              sleep 2
            done
            echo "Service did not become healthy in time" >&2
            journalctl -u "${{ secrets.DEPLOY_SERVICE }}" -n 50 --no-pager || true
            exit 1
